name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src/

      - name: Run tests
        env:
          # config.py raises at import time if this is unset - none of the
          # tests make live API calls, so a placeholder is fine here.
          ANTHROPIC_API_KEY: ci-placeholder-not-a-real-key
        run: uv run pytest -q
