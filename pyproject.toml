[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "job-scout"
version = "0.1.0"
description = "Automated job offer triage pipeline using the Claude API (RAG + semantic dedup)"
requires-python = ">=3.10"
dependencies = [
    "anthropic",
    "python-dotenv",
    "pydantic",
    "truststore>=0.10.4",
]

[project.scripts]
job-scout = "job_scout.cli:main"

[dependency-groups]
dev = ["pytest"]

[tool.setuptools]
package-dir = {"" = "src"}
