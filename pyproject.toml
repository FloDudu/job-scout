[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "job-scout"
version = "0.1.0"
description = "Automated job offer triage pipeline using the Claude API (RAG + semantic dedup)"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.120.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0",
    "truststore>=0.10.4",
    "voyageai>=0.5.0",
]

[project.scripts]
job-scout = "job_scout.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest",
    "ruff>=0.16.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
